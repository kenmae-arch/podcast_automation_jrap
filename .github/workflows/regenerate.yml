name: Regenerate Episode Audio

# 配信済みエピソードの音声だけを作り直す(読み仮名改善など)。
# ファイル名は変わり、guid は維持される(tools/regenerate_episode.py 参照)。

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "通算エピソード番号"
        required: true
        default: "1"
      suffix:
        description: "新しい音声ファイル名の接尾辞"
        required: true
        default: "v2"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (pydub用)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate episode audio
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python tools/regenerate_episode.py "${{ inputs.episode }}" --suffix "${{ inputs.suffix }}"

      - name: Commit and push regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Regenerate episode ${{ inputs.episode }} audio (${{ inputs.suffix }})"
          git push
